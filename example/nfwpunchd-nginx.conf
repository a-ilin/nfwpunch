server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name auth.example.com;

    # SSL configuration would go here.

    # /web endpoint: grant access for the current IP address to the "web" service for 30 minutes (1800 seconds) after successful authentication.
    location /web {
        # User authentication configuration would go here.
        # Example: auth_basic "Restricted"; auth_basic_user_file /etc/nginx/htpasswd;

        # Requires lua-nginx-module (e.g. libnginx-mod-http-lua); runs only after authentication succeeds.
        content_by_lua_block {
            local sock = ngx.socket.tcp()
            sock:settimeouts(1000, 1000, 1000)

            local ok, err = sock:connect("unix:/run/nfwpunch/nfwpunch.sock")
            if not ok then
                ngx.log(ngx.ERR, "nfwpunchd connect failed: ", err)
                return ngx.exit(ngx.HTTP_BAD_GATEWAY)
            end

            -- Service name and timeout (seconds) must match nfwpunch.conf.
            sock:send("authorize " .. ngx.var.remote_addr .. " web 1800\n")
            local reply = sock:receive("*l")
            sock:close()

            if reply ~= "OK authorized" then
                ngx.log(ngx.ERR, "nfwpunchd replied: ", reply)
                return ngx.exit(ngx.HTTP_FORBIDDEN)
            end

            ngx.header['content-type'] = 'text/html'
            ngx.say("Access granted")
        }
    }

    # /web-logout endpoint: revoke access for the current IP address from the "web" service.
    location = /web-logout {
        # User authentication configuration would go here.
        # Example: auth_basic "Restricted"; auth_basic_user_file /etc/nginx/htpasswd;

        # Requires lua-nginx-module (e.g. libnginx-mod-http-lua); runs only after authentication succeeds.
        content_by_lua_block {
            local sock = ngx.socket.tcp()
            sock:settimeouts(1000, 1000, 1000)

            local ok, err = sock:connect("unix:/run/nfwpunch/nfwpunch.sock")
            if not ok then
                ngx.log(ngx.ERR, "nfwpunchd connect failed: ", err)
                return ngx.exit(ngx.HTTP_BAD_GATEWAY)
            end

            sock:send("revoke " .. ngx.var.remote_addr .. " web\n")
            local reply = sock:receive("*l")
            sock:close()

            if reply ~= "OK revoked" then
                ngx.log(ngx.ERR, "nfwpunchd replied: ", reply)
                return ngx.exit(ngx.HTTP_FORBIDDEN)
            end

            ngx.header['content-type'] = 'text/html'
            ngx.say("Access revoked")
        }
    }
}
