; Global options
[global]
; The priority of the hook script. Lower numbers are executed first. The default is 0. Negative numbers are allowed.
;
;hook_priority = -5

; Mark accepted packets with this value. The default is 0 (no mark is set).
; This value may be used to identify packets that have been accepted by the puncher and should not be dropped in the chains with lower priority.
; For example, add this rule to a lower-priority chain to keep the marked accepted packets:
;   meta mark & 0x00000080 == 0x00000080 counter accept
;
;mark_accepted = 128

; Declaration of services and their ports.
[services]
; Each line defines a service, and the assigned ports for that service.
; The format is:
; service_name = ip_family:protocol port1, port2, port3, ...
; Supported families: ip, ip6.
; Supported protocols: tcp, udp.

;web = ip:tcp:80,443 ip6:tcp:80,443
;admin = ip:tcp:22 ip6:tcp:22
