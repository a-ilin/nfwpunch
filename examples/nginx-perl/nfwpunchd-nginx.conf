perl_modules /usr/share/doc/nfwpunch/examples/nginx-perl;
perl_require nfwpunchd-nginx.pl;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name auth.example.com;

    # SSL configuration would go here.

    # Default location: return 404 for all other requests.
    location / {
        return 404;
    }

    # /web endpoint: grant access for the current IP address to the "web" service for 30 minutes (1800 seconds) after successful authentication.
    location /web {
        # User authentication configuration would go here.
        # Example: auth_basic "Restricted"; auth_basic_user_file /etc/nginx/htpasswd;

        # Requires nginx perl module (e.g. libnginx-mod-http-perl); runs only after authentication succeeds.
        perl NFWPunch::Nginx::authorize_web;
    }

    # /web-logout endpoint: revoke access for the current IP address from the "web" service.
    location = /web-logout {
        # User authentication configuration would go here.
        # Example: auth_basic "Restricted"; auth_basic_user_file /etc/nginx/htpasswd;

        # Requires nginx perl module (e.g. libnginx-mod-http-perl); runs only after authentication succeeds.
        perl NFWPunch::Nginx::revoke_web;
    }
}
